name: Build fixed APK

# Builds an arm64 APK from `custom` (upstream main + the local fixes).
#
# Actions → Build fixed APK → Run workflow, or push to `custom`.
# The APK is uploaded as an artifact and refreshed on the `strip-fix` release.
# Without app/android/key.properties it is debug-signed; the phone accepts it
# over the released build (cross-signature install is allowed there).

on:
  workflow_dispatch:
  push:
    branches: [custom]
    paths:
      - 'app/**'
      - 'packages/**'
      - 'runtime/**'
      - 'tooling/**'
      - '.github/workflows/build-fixed-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-fixed-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  FLUTTER_SHA256: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the strip fix is in this checkout
        run: |
          set -euo pipefail
          n=$(grep -c 'AnimatedSwitcher(' app/lib/ui/plugins/native/composer_strip.dart)
          test "$n" -eq 1
          echo "composer_strip.dart has one AnimatedSwitcher (the in-line text one), as expected"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --http1.1 -o /tmp/flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "$FLUTTER_SHA256  /tmp/flutter.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/dev"
          tar -xJf /tmp/flutter.tar.xz -C "$HOME/dev"
          echo "$HOME/dev/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/dev/flutter/bin/flutter" config --no-analytics
          "$HOME/dev/flutter/bin/flutter" --version

      - name: Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          EXT=$(find "$HOME/dev/flutter/packages/flutter_tools/gradle/src/main" -name 'FlutterExtension.*' -print -quit)
          COMPILE_SDK=$(grep -oE 'compileSdkVersion[^0-9]*[0-9]+' "$EXT" | grep -oE '[0-9]+$' | head -1)
          NDK=$(grep -oE 'ndkVersion[^"]*"[0-9.]+"' "$EXT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "compileSdk=${COMPILE_SDK:-36} ndk=${NDK:-unknown} (+ 28.2.13676358 for tawcroot)"
          PKGS=("platform-tools" "platforms;android-${COMPILE_SDK:-36}" "build-tools;${COMPILE_SDK:-36}.0.0"
                "cmake;3.22.1" "ndk;28.2.13676358")
          if [ -n "$NDK" ] && [ "$NDK" != "28.2.13676358" ]; then PKGS+=("ndk;$NDK"); fi
          "$SM" --sdk_root="$SDK" "${PKGS[@]}"
          # The runner image points ANDROID_NDK_HOME at its own NDK; the
          # tawcroot helper needs the pinned 28.2.13676358 or refuses to build.
          test -f "$SDK/ndk/28.2.13676358/source.properties"
          grep -q '^Pkg.Revision=28.2.13676358' "$SDK/ndk/28.2.13676358/source.properties"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Use the official Gradle distribution
        run: |
          sed -i 's#https://mirrors.cloud.tencent.com/gradle/#https://services.gradle.org/distributions/#' \
            app/android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Cache runtime downloads
        uses: actions/cache@v4
        with:
          path: runtime/.cache
          key: runtime-cache-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**', 'runtime/patches/pins.json') }}
          restore-keys: runtime-cache-

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('app/pubspec.lock', 'packages/**/pubspec.lock') }}
          restore-keys: pub-

      - name: Build the arm64 runtime
        run: |
          set -euo pipefail
          export PATH="$HOME/dev/flutter/bin:$JAVA_HOME/bin:$PATH"
          bash runtime/build-runtime.sh arm64-v8a

      - name: Build the APK
        run: |
          set -euo pipefail
          export PATH="$HOME/dev/flutter/bin:$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$PATH"
          DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64 --no-companion --no-star --keep-daemon
          ls -lh app/build/app/outputs/flutter-apk/

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-strip-fix
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/app/outputs/flutter-apk/app-arm64-release.apk
          if gh release view strip-fix >/dev/null 2>&1; then
            gh release upload strip-fix "$APK" --clobber
          else
            gh release create strip-fix "$APK" \
              --target "$GITHUB_SHA" \
              --title "DSH Go · strip flicker fix" \
              --notes "custom = upstream main + local fixes. Install over the current app; data is kept. Debug-signed (no release key in this repo)." \
              --prerelease
          fi
